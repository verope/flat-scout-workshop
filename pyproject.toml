[project]
name = "flat-scout"
version = "0.1.0"
description = "Scores London rental listings against a written brief"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "logfire>=4.40.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.30.0",
    "pymc>=5.28.5",
    "pypdfium2>=5.13.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
    "sqlite-utils>=4.2.1",
    "tqdm>=4.70.0",
    "typer>=0.27.1",
]

[project.scripts]
flat-scout = "flat_scout.cli:app"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
markers = ["slow: samples a PyMC model; seconds, not milliseconds"]
testpaths = ["tests"]
